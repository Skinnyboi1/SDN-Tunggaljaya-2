<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Operator - SD N TUNGGALJAYA 2</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./images/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#f1d7c6',
                            50: '#fdfbf9',
                            100: '#faf4ef',
                            200: '#f5e5da',
                            300: '#f1d7c6',
                            400: '#e4bca2',
                            500: '#d49e7b',
                            600: '#c1815b',
                            700: '#a36544',
                            800: '#845139',
                            900: '#6d4330',
                            950: '#3b2116',
                        },
                        secondary: {
                            DEFAULT: '#b68a70',
                            50: '#fbf8f6',
                            100: '#f5ede7',
                            200: '#ebdcd2',
                            300: '#dcc2b2',
                            400: '#cba58f',
                            500: '#b68a70',
                            600: '#9e6f54',
                            700: '#835841',
                            800: '#6c4837',
                            900: '#593c2e',
                            950: '#311f17',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-primary text-slate-900 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-secondary text-white rounded-3xl border border-[#9e6f54] shadow-2xl p-6 sm:p-8 space-y-6">
        
        <!-- Header with Logo -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-2xl bg-primary flex items-center justify-center p-2 mx-auto shadow-md border border-primary-200">
                <img src="./images/logo.png" alt="Logo SDN Tunggaljaya 2" class="w-full h-full object-contain">
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Login Operator Cloud</h1>
            <p class="text-xs text-primary">Masuk untuk mengelola data & profil SD N TUNGGALJAYA 2</p>
        </div>

        <!-- Alert Notification -->
        <div id="login-alert" class="hidden p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2">
            <i id="alert-icon" class="fa-solid fa-circle-exclamation text-base"></i>
            <span id="alert-message"></span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            
            <div>
                <label for="email" class="block text-xs font-bold text-white mb-1">Alamat Email Operator</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-primary">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <input type="email" id="email" name="email" required
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#9e6f54] border border-[#835841] text-white placeholder-primary-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm transition"
                           placeholder="operator@tunggaljaya2.sch.id">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-white mb-1">Kata Sandi (Password)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-primary">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" name="password" required
                           class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-[#9e6f54] border border-[#835841] text-white placeholder-primary-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm transition"
                           placeholder="••••••••">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-primary hover:text-white cursor-pointer">
                        <i class="fa-solid fa-eye" id="password-eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3 rounded-xl bg-primary hover:bg-primary-200 text-slate-950 font-extrabold text-sm shadow-lg transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="fa-solid fa-right-to-bracket text-secondary"></i>
                <span id="btn-text">Masuk ke Panel Operator</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-[#835841]"></div>
            <span class="flex-shrink mx-4 text-primary text-[11px] font-bold">ATAU</span>
            <div class="flex-grow border-t border-[#835841]"></div>
        </div>

        <!-- Google Login Button -->
        <button type="button" id="google-btn" class="w-full py-2.5 rounded-xl bg-white hover:bg-slate-100 text-slate-800 font-bold text-xs shadow transition flex items-center justify-center gap-2 cursor-pointer">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Masuk dengan Akun Google
        </button>

        <!-- Back to Website -->
        <div class="text-center pt-2 border-t border-[#835841]">
            <a href="./" class="text-xs text-primary hover:text-white font-bold inline-flex items-center gap-1.5 transition">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Halaman Utama
            </a>
        </div>

    </div>

    <!-- Firebase Auth Logic Script -->
    <script type="module">
        import { auth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "./js/firebase-config.js";

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const googleBtn = document.getElementById('google-btn');
        const alertBox = document.getElementById('login-alert');
        const alertMessage = document.getElementById('alert-message');
        const alertIcon = document.getElementById('alert-icon');
        const togglePassword = document.getElementById('toggle-password');
        const passwordEyeIcon = document.getElementById('password-eye-icon');

        // Toggle password visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordEyeIcon.classList.toggle('fa-eye');
            passwordEyeIcon.classList.toggle('fa-eye-slash');
        });

        // Show alert helper
        function showAlert(msg, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-rose-600', 'bg-emerald-600', 'border-rose-500', 'border-emerald-500');
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-600', 'text-white', 'border', 'border-emerald-500');
                alertIcon.className = 'fa-solid fa-circle-check text-base';
            } else {
                alertBox.classList.add('bg-rose-600', 'text-white', 'border', 'border-rose-500');
                alertIcon.className = 'fa-solid fa-triangle-exclamation text-base';
            }
            alertMessage.innerText = msg;
        }

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                showAlert(`Sesi aktif terdeteksi (${user.email}). Mengalihkan ke Panel Operator...`, 'success');
                setTimeout(() => {
                    window.location.href = './operator.html';
                }, 800);
            }
        });

        // Handle Email/Password Login
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            submitBtn.disabled = true;
            btnText.innerText = 'Memverifikasi...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                showAlert('Login berhasil! Mengalihkan...', 'success');
                setTimeout(() => {
                    window.location.href = './operator.html';
                }, 800);
            } catch (error) {
                submitBtn.disabled = false;
                btnText.innerText = 'Masuk ke Panel Operator';
                console.error('Login error:', error);
                
                let msg = 'Gagal masuk. Periksa kembali email dan password Anda.';
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = 'Email atau kata sandi tidak cocok. Pastikan akun telah didaftarkan di Firebase Console.';
                } else if (error.code === 'auth/too-many-requests') {
                    msg = 'Terlalu banyak percobaan gagal. Silakan coba beberapa saat lagi.';
                }
                showAlert(msg, 'error');
            }
        });

        // Handle Google Login
        googleBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                showAlert('Login Google berhasil! Mengalihkan...', 'success');
                setTimeout(() => {
                    window.location.href = './operator.html';
                }, 800);
            } catch (error) {
                console.error('Google Sign-In Error:', error);
                showAlert('Gagal login via Google: ' + error.message, 'error');
            }
        });
    </script>
</body>
</html>
