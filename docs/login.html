<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Operator Supabase - SD N TUNGGALJAYA 2</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./images/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#f1d7c6',
                            50: '#fdfbf9',
                            100: '#faf4ef',
                            200: '#f5e5da',
                            300: '#f1d7c6',
                            400: '#e4bca2',
                            500: '#d49e7b',
                            600: '#c1815b',
                            700: '#a36544',
                            800: '#845139',
                            900: '#6d4330',
                            950: '#3b2116',
                        },
                        secondary: {
                            DEFAULT: '#b68a70',
                            50: '#fbf8f6',
                            100: '#f5ede7',
                            200: '#ebdcd2',
                            300: '#dcc2b2',
                            400: '#cba58f',
                            500: '#b68a70',
                            600: '#9e6f54',
                            700: '#835841',
                            800: '#6c4837',
                            900: '#593c2e',
                            950: '#311f17',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-primary min-h-screen font-sans flex items-center justify-center p-4 antialiased selection:bg-secondary selection:text-white">

    <div class="w-full max-w-md">
        <!-- Logo & Header Branding -->
        <div class="text-center mb-6 space-y-2">
            <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-secondary shadow-lg border border-secondary-600 mb-1">
                <img src="./images/logo.png" alt="Logo SDN Tunggaljaya 2" class="w-12 h-12 object-contain">
            </div>
            <h1 class="text-2xl font-extrabold text-[#3b2116] tracking-tight">SD N TUNGGALJAYA 2</h1>
            <p class="text-xs font-semibold text-secondary-800">Panel Operator & Control Center Terintegrasi Supabase Cloud</p>
        </div>

        <!-- Main Login Card -->
        <div class="bg-secondary rounded-3xl p-6 sm:p-8 shadow-2xl border border-[#9e6f54] text-white space-y-6">
            
            <div class="border-b border-[#9e6f54] pb-4 flex items-center justify-between">
                <div>
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-lock text-primary"></i> Masuk Akun Operator
                    </h2>
                    <p class="text-xs text-primary-100">Gunakan akun email admin Supabase Anda.</p>
                </div>
                <span class="px-2.5 py-1 rounded-full bg-[#3b2116] text-[10px] font-extrabold text-emerald-400 border border-[#6d4330]">
                    v2.0 Online
                </span>
            </div>

            <!-- Flash Alert Message Box -->
            <div id="login-alert" class="hidden p-3.5 rounded-2xl text-xs font-semibold flex items-start gap-2.5 shadow-md">
                <i id="alert-icon" class="fa-solid fa-circle-info text-base shrink-0 mt-0.5"></i>
                <div id="alert-message" class="leading-relaxed"></div>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4 text-xs">
                <div>
                    <label for="email" class="block font-bold text-white mb-1.5">Alamat Email Operator</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-primary-200">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input type="email" id="email" required placeholder="operator.tunggaljaya2@gmail.com" class="w-full pl-10 pr-3.5 py-3 rounded-xl bg-[#3b2116] border border-[#6d4330] text-white placeholder-primary-300 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block font-bold text-white">Kata Sandi (Password)</label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-primary-200">
                            <i class="fa-solid fa-key"></i>
                        </div>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-10 py-3 rounded-xl bg-[#3b2116] border border-[#6d4330] text-white placeholder-primary-300 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-primary-200 hover:text-white transition">
                            <i id="password-eye-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 rounded-xl bg-primary hover:bg-primary-200 text-slate-950 font-extrabold text-xs transition shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-right-to-bracket text-secondary"></i> <span id="btn-text">Masuk ke Panel Operator</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer Info & Links -->
        <div class="text-center mt-6 space-y-2">
            <a href="./" class="text-xs font-extrabold text-[#3b2116] hover:underline inline-flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Website Utama
            </a>
            <p class="text-[11px] font-medium text-secondary-800">&copy; 2026 SDN Tunggaljaya 2. All rights reserved.</p>
        </div>
    </div>

    <!-- Supabase Auth Script -->
    <script type="module">
        import { supabase, getSupabaseCredentials } from "./js/supabase-config.js";

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const alertBox = document.getElementById('login-alert');
        const alertMessage = document.getElementById('alert-message');
        const alertIcon = document.getElementById('alert-icon');
        const togglePassword = document.getElementById('toggle-password');
        const passwordEyeIcon = document.getElementById('password-eye-icon');

        // Toggle password visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordEyeIcon.classList.toggle('fa-eye');
            passwordEyeIcon.classList.toggle('fa-eye-slash');
        });

        // Show alert helper
        function showAlert(msg, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-rose-600', 'bg-emerald-600', 'border-rose-500', 'border-emerald-500');
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-600', 'text-white', 'border', 'border-emerald-500');
                alertIcon.className = 'fa-solid fa-circle-check text-base';
            } else {
                alertBox.classList.add('bg-rose-600', 'text-white', 'border', 'border-rose-500');
                alertIcon.className = 'fa-solid fa-triangle-exclamation text-base';
            }
            alertMessage.innerText = msg;
        }

        // Check active session
        async function checkActiveSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session?.user) {
                    showAlert(`Sesi aktif terdeteksi (${session.user.email}). Mengalihkan ke Panel Operator...`, 'success');
                    setTimeout(() => {
                        window.location.href = './operator.html';
                    }, 800);
                }
            } catch (err) {
                console.warn('Session check notice:', err);
            }
        }
        checkActiveSession();

        // Handle Email/Password Login
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            submitBtn.disabled = true;
            btnText.innerText = 'Memverifikasi...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                showAlert('Login berhasil! Mengalihkan ke Panel Operator...', 'success');
                setTimeout(() => {
                    window.location.href = './operator.html';
                }, 800);
            } catch (error) {
                submitBtn.disabled = false;
                btnText.innerText = 'Masuk ke Panel Operator';
                console.error('Login error:', error);
                
                let msg = error.message || 'Gagal masuk. Periksa kembali email dan password Anda.';
                if (error.message?.includes('Invalid login credentials')) {
                    msg = 'Email atau kata sandi tidak cocok di Supabase Auth. Silakan periksa kembali kredensial Anda.';
                } else if (error.message?.includes('Email not confirmed')) {
                    msg = 'Email belum dikonfirmasi di Supabase (aktifkan Auto Confirm di Auth Settings).';
                }
                showAlert(msg, 'error');
            }
        });
    </script>
</body>
</html>
