name: Deploy Static Website to GitHub Pages

on:
  push:
    branches: ["main", "master", "bsieksplor"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy .env
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Generate App Key
        run: php artisan key:generate

      - name: Setup Database & Seed Initial Data
        run: |
          touch database/database.sqlite
          chmod -R 777 storage bootstrap/cache database
          php artisan migrate:fresh --seed --force

      - name: Install & Build NPM Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Export Static HTML Pages
        run: |
          mkdir -p dist
          # Start Laravel local built-in server in background
          php artisan serve --host=127.0.0.1 --port=8000 &
          SERVER_PID=$!
          sleep 4

          # Fetch public homepage
          curl -s http://127.0.0.1:8000/ -o dist/index.html

          # Fix root-relative asset URLs for GitHub Pages repository subdirectory (/SDN-Tunggaljaya-2/)
          sed -i 's|href="/build/|href="/SDN-Tunggaljaya-2/build/|g' dist/index.html || true
          sed -i 's|src="/build/|src="/SDN-Tunggaljaya-2/build/|g' dist/index.html || true
          sed -i 's|href="/storage/|href="/SDN-Tunggaljaya-2/storage/|g' dist/index.html || true
          sed -i 's|src="/storage/|src="/SDN-Tunggaljaya-2/storage/|g' dist/index.html || true
          sed -i 's|href="/images/|href="/SDN-Tunggaljaya-2/images/|g' dist/index.html || true
          sed -i 's|src="/images/|src="/SDN-Tunggaljaya-2/images/|g' dist/index.html || true
          sed -i 's|href="/uploads/|href="/SDN-Tunggaljaya-2/uploads/|g' dist/index.html || true
          sed -i 's|src="/uploads/|src="/SDN-Tunggaljaya-2/uploads/|g' dist/index.html || true

          # Copy public build assets, images & uploads
          if [ -d "public/build" ]; then cp -r public/build dist/; fi
          if [ -d "public/storage" ]; then cp -r public/storage dist/; fi
          if [ -d "public/images" ]; then cp -r public/images dist/; fi
          if [ -d "public/uploads" ]; then cp -r public/uploads dist/; fi
          if [ -f "public/favicon.ico" ]; then cp public/favicon.ico dist/; fi
          
          # Kill background server
          kill $SERVER_PID || true

      - name: Upload Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
